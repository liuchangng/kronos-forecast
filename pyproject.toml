[project]
name = "kronos-forecast"
version = "0.1.0"
description = "Kronos A股预测面板，基于Kronos基础模型的金融K线预测"
requires-python = ">=3.12,<3.14"
dependencies = [
    "gradio>=5.0",
    "torch==2.13.0+cu126",
    "pandas>=2.1",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "requests>=2.31",
    "huggingface_hub>=0.23",
    "einops>=0.7",
    "safetensors>=0.4",
    "tqdm>=4.66",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
